<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR-Code Generator</title>
    
    <!-- CDN-Skripte für den Online-Modus -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 { font-size: 22px; margin-top: 0; text-align: center; color: #111; }
        p.subtitle { font-size: 14px; color: #666; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #0066cc; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #0052a3; }
        .output-area { margin-top: 30px; padding: 20px; background: #f8f9fa; border: 2px dashed #ccc; border-radius: 8px; text-align: center; min-height: 100px; }
        #qrcode-output { display: flex; justify-content: center; margin: 15px 0; }
        #barcode-output { max-width: 100%; height: auto; display: none; margin: 15px auto; }
        .download-btn { background-color: #28a745; margin-top: 15px; display: none; }
        .download-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h1>Barcode & QR-Code Generator</h1>
    <p class="subtitle">Funktioniert online und offline direkt im Browser</p>
    
    <div class="form-group">
        <label for="codeType">1. Typ auswählen:</label>
        <select id="codeType" onchange="updateLabels()">
            <option value="QR">QR-Code (Für Web-Links / URLs)</option>
            <option value="CODE128">Barcode: Code 128 (Universell)</option>
            <option value="EAN13">Barcode: EAN-13 (12-13 Zahlen für Handel)</option>
        </select>
    </div>

    <div class="form-group">
        <label id="inputLabel" for="textInput">2. Link oder Text eingeben:</label>
        <input type="text" id="textInput" value="https://google.com">
    </div>

    <button type="button" onclick="generateNow()">Code generieren</button>

    <div class="output-area">
        <div id="statusText" style="color: #888;">Ihr Code wird hier angezeigt</div>
        
        <!-- Hier werden die Codes injiziert -->
        <div id="qrcode-output"></div>
        <img id="barcode-output" alt="Barcode">
        
        <button id="downloadBtn" class="download-btn" onclick="saveImage()">Grafik herunterladen (.png)</button>
    </div>
</div>

<script>
    // Passt die Platzhalter an, wenn der Code-Typ gewechselt wird
    function updateLabels() {
        const type = document.getElementById('codeType').value;
        const label = document.getElementById('inputLabel');
        const input = document.getElementById('textInput');
        
        if (type === 'QR') {
            label.textContent = "2. Website-Link (URL) eingeben:";
            input.value = "https://";
        } else if (type === 'EAN13') {
            label.textContent = "2. Zahlenkette eingeben (Exakt 12 oder 13 Ziffern):";
            input.value = "1234567890128";
        } else {
            label.textContent = "2. Text oder Zahlen eingeben:";
            input.value = "ARTIKEL-123";
        }
    }

    // Hauptfunktion zum Generieren
    function generateNow() {
        const type = document.getElementById('codeType').value;
        const value = document.getElementById('textInput').value.trim();
        
        const statusText = document.getElementById('statusText');
        const qrOutput = document.getElementById('qrcode-output');
        const barcodeOutput = document.getElementById('barcode-output');
        const downloadBtn = document.getElementById('downloadBtn');

        // Reset der Anzeige
        qrOutput.innerHTML = "";
        barcodeOutput.style.display = "none";
        downloadBtn.style.display = "none";
        statusText.style.display = "block";

        if (!value) {
            alert("Bitte geben Sie zuerst einen Text oder Link ein.");
            return;
        }

        try {
            if (type === 'QR') {
                if (typeof QRCode === "undefined") {
                    alert("Hinweis: Sie sind offline. Um QR-Codes offline zu nutzen, speichern Sie die 'qrcode.min.js' lokal ab.");
                    return;
                }
                statusText.style.display = "none";
                new QRCode(qrOutput, {
                    text: value,
                    width: 180,
                    height: 180,
                    correctLevel: QRCode.CorrectLevel.H
                });
                // Kurze Verzögerung, damit das QR-Bild generiert wird, bevor der Download-Button erscheint
                setTimeout(() => { downloadBtn.style.display = "block"; }, 100);
                
            } else {
                if (typeof JsBarcode === "undefined") {
                    alert("Hinweis: Sie sind offline. Um Barcodes offline zu nutzen, speichern Sie die 'JsBarcode.all.min.js' lokal ab.");
                    return;
                }
                statusText.style.display = "none";
                barcodeOutput.style.display = "block";
                
                JsBarcode(barcodeOutput, value, {
                    format: type,
                    lineColor: "#000",
                    width: 2,
                    height: 80,
                    displayValue: true
                });
                downloadBtn.style.display = "block";
            }
        } catch (e) {
            alert("Fehler bei der Generierung. Überprüfen Sie, ob Ihre Eingabe zum gewählten Typ passt.");
            statusText.style.display = "block";
        }
    }

    // Speicherfunktion für das fertige Bild
    function saveImage() {
        const type = document.getElementById('codeType').value;
        let dataUrl = "";
        let filename = "code.png";

        if (type === 'QR') {
            const img = document.querySelector('#qrcode-output img');
            if (img) {
                dataUrl = img.src;
                filename = "qrcode.png";
            }
        } else {
            const img = document.getElementById('barcode-output');
            if (img) {
                dataUrl = img.src;
                filename = "barcode.png";
            }
        }

        if (dataUrl) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        } else {
            alert("Fehler beim Herunterladen des Bildes.");
        }
    }
</script>
</body>
</html>
