<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcode & QR-Code Generator</title>
    <link rel="stylesheet" type="text/css" href="styles.css"/>
    <script src="https://jsdelivr.net"></script>
    <script src="https://cloudflare.com"></script>
</head>
<body>

<div class="container">
    <h1>Barcode & QR-Code Generator</h1>
    <p class="description">Erstellen Sie Codes online oder offline im Browser.</p>
    
    <div class="form-group">
        <label for="codeType">Code-Typ wählen:</label>
        <select id="codeType" onchange="toggleInputs()">
            <option value="QR">QR-Code (Für Website-Links / URLs)</option>
            <option value="CODE128">Barcode: Code 128 (Universell)</option>
            <option value="EAN13">Barcode: EAN-13 (Handel)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="textInput" id="inputLabel">Website-Link (URL):</label>
        <input type="text" id="textInput" placeholder="https://example.com" value="https://">
    </div>

    <button onclick="generateCode()">Code generieren</button>

    <div class="output-box">
        <div id="qrcode" class="hidden"></div>
        <svg id="barcode" class="hidden"></svg>
        <p id="placeholderText" style="color: #999; margin: 0;">Ihr generierter Code erscheint hier</p>
        <button id="downloadBtn" class="download-btn hidden" onclick="downloadImage()">Grafik herunterladen</button>
    </div>
</div>

<script>
    function toggleInputs() {
        const type = document.getElementById('codeType').value;
        const label = document.getElementById('inputLabel');
        const input = document.getElementById('textInput');
        
        if (type === 'QR') {
            label.textContent = "Website-Link (URL):";
            input.placeholder = "https://example.com";
            input.value = "https://";
        } else if (type === 'EAN13') {
            label.textContent = "Numerischer Code (Exakt 12 oder 13 Ziffern):";
            input.placeholder = "1234567890128";
            input.value = "1234567890128";
        } else {
            label.textContent = "Inhalt (Text oder Zahlen):";
            input.placeholder = "PRODUKT-123";
            input.value = "PRODUKT-123";
        }
    }

    function generateCode() {
        const type = document.getElementById('codeType').value;
        const val = document.getElementById('textInput').value.trim();
        const qrDiv = document.getElementById('qrcode');
        const barcodeSvg = document.getElementById('barcode');
        const placeholder = document.getElementById('placeholderText');
        const downloadBtn = document.getElementById('downloadBtn');

        qrDiv.innerHTML = "";
        qrDiv.classList.add('hidden');
        barcodeSvg.classList.add('hidden');
        placeholder.classList.add('hidden');
        downloadBtn.classList.add('hidden');

        if (!val) { alert("Bitte einen Wert eingeben."); placeholder.classList.remove('hidden'); return; }

        try {
            if (type === 'QR') {
                qrDiv.classList.remove('hidden');
                new QRCode(qrDiv, { text: val, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.H });
            } else {
                barcodeSvg.classList.remove('hidden');
                JsBarcode("#barcode", val, { format: type, lineColor: "#000", width: 2, height: 80, displayValue: true });
            }
            downloadBtn.classList.remove('hidden');
        } catch (error) {
            alert("Fehler beim Generieren. Überprüfen Sie das Format.");
            placeholder.classList.remove('hidden');
        }
    }

    function downloadImage() {
        const type = document.getElementById('codeType').value;
        if (type === 'QR') {
            const img = document.querySelector('#qrcode img');
            if (img) triggerDownload(img.src, 'qrcode.png');
        } else {
            const svg = document.getElementById('barcode');
            const svgString = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgString], {type: "image/svg+xml;charset=utf-8"});
            const blobURL = URL.createObjectURL(svgBlob);
            const image = new Image();
            image.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = image.width; canvas.height = image.height;
                canvas.getContext('2d').drawImage(image, 0, 0);
                triggerDownload(canvas.toDataURL("image/png"), 'barcode.png');
            };
            image.src = blobURL;
        }
    }

    function triggerDownload(dataUrl, filename) {
        const a = document.createElement('a');
        a.href = dataUrl; a.download = filename;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }
</script>
</body>
</html>
